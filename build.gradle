// Root project: shared versioning and release distribution.
// Loader toolchains live in :fabric / :neoforge.

plugins {
	id 'base'
}

allprojects {
	group = rootProject.maven_group
	version = rootProject.mod_version

	repositories {
		mavenCentral()
		maven { url = 'https://api.modrinth.com/maven' }
		maven { url = 'https://maven.shedaniel.me/' }
		maven { url = 'https://maven.terraformersmc.com/releases/' }
		maven { url = 'https://modmaven.dev' }
		maven { url = 'https://maven.neoforged.net/releases' }
	}
}

subprojects {
	tasks.withType(JavaCompile).configureEach {
		options.release = 25
		options.encoding = 'UTF-8'
	}
}

/**
 * Builds both loaders and copies installable jars into build/release/:
 *   spellgems-<version>-fabric.jar
 *   spellgems-<version>-neoforge.jar
 *
 * Usage:
 *   ./gradlew releaseJars
 */
tasks.register('releaseJars', Copy) {
	group = 'distribution'
	description = 'Build Fabric + NeoForge and copy installable jars to build/release/'
	dependsOn ':fabric:build', ':neoforge:build'

	// Fresh release folder each run
	doFirst {
		def releaseDir = layout.buildDirectory.dir('release').get().asFile
		if (releaseDir.exists()) {
			delete releaseDir
		}
		releaseDir.mkdirs()
	}

	from(project(':fabric').layout.buildDirectory.dir('libs')) {
		include '*-fabric.jar'
		exclude '*-sources.jar', '*-fabric-sources.jar', '*-dev.jar', '*-javadoc.jar'
	}
	from(project(':neoforge').layout.buildDirectory.dir('libs')) {
		include '*-neoforge.jar'
		exclude '*-sources.jar', '*-neoforge-sources.jar', '*-dev.jar', '*-javadoc.jar'
	}
	into(layout.buildDirectory.dir('release'))

	duplicatesStrategy = DuplicatesStrategy.FAIL

	doLast {
		def releaseDir = layout.buildDirectory.dir('release').get().asFile
		def jars = releaseDir.listFiles({ f -> f.name.endsWith('.jar') } as FileFilter) ?: [] as File[]
		logger.lifecycle('Release jars in {}:', releaseDir)
		jars.each { logger.lifecycle('  {} ({} bytes)', it.name, it.length()) }
		if (jars.length < 2) {
			throw new GradleException("Expected 2 release jars (fabric + neoforge), found ${jars.length}")
		}
	}
}

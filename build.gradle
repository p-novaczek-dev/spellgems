// Root project: shared versioning only. Loader toolchains live in :fabric / :neoforge.

plugins {
	id 'base'
}

allprojects {
	group = rootProject.maven_group
	version = rootProject.mod_version

	repositories {
		mavenCentral()
		maven { url = 'https://api.modrinth.com/maven' }
		maven { url = 'https://maven.shedaniel.me/' }
		maven { url = 'https://maven.terraformersmc.com/releases/' }
		maven { url = 'https://modmaven.dev' }
		maven { url = 'https://maven.neoforged.net/releases' }
	}
}

subprojects {
	tasks.withType(JavaCompile).configureEach {
		options.release = 25
		options.encoding = 'UTF-8'
	}
}

// Collect both loader distribution jars after they exist.
tasks.register('releaseJars', Copy) {
	group = 'distribution'
	description = 'Copies fabric + neoforge jars into build/release (run after both builds).'
	dependsOn ':fabric:build'
	// :neoforge:build is optional until the Neo module is implemented
	from(project(':fabric').layout.buildDirectory.dir('libs')) {
		include '*.jar'
		exclude '*-sources.jar', '*-dev.jar', '*-javadoc.jar'
	}
	into(layout.buildDirectory.dir('release'))
	doFirst {
		if (project(':neoforge').tasks.findByName('build') != null
				&& project(':neoforge').tasks.named('build').get().state.executed) {
			// no-op; copies are additive via additional from below when neo builds
		}
	}
}

// Prefer: ./gradlew :fabric:build :neoforge:build releaseJars once Neo exists.
tasks.register('releaseJarsBoth', Copy) {
	group = 'distribution'
	description = 'Builds fabric+neoforge and copies jars to build/release.'
	dependsOn ':fabric:build', ':neoforge:build'
	from(project(':fabric').layout.buildDirectory.dir('libs')) {
		include '*.jar'
		exclude '*-sources.jar', '*-dev.jar', '*-javadoc.jar'
	}
	from(project(':neoforge').layout.buildDirectory.dir('libs')) {
		include '*.jar'
		exclude '*-sources.jar', '*-dev.jar', '*-javadoc.jar'
	}
	into(layout.buildDirectory.dir('release'))
}

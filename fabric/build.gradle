plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'java'
}

// Final installable jar name: spellgems-<version>-fabric.jar
base {
	archivesName = archives_base_name
}

version = rootProject.mod_version
group = rootProject.maven_group

def commonDir = rootProject.file('common')

loom {
	splitEnvironmentSourceSets()

	mods {
		'spellgems' {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		configureEach {
			// default is fine (fabric/run)
		}
	}
}

// Include shared common sources/resources in Fabric compilation
sourceSets {
	main {
		java {
			srcDir new File(commonDir, 'src/main/java')
		}
		resources {
			srcDir new File(commonDir, 'src/main/resources')
			srcDir new File(commonDir, 'src/main/generated')
		}
	}
	client {
		java {
			srcDir new File(commonDir, 'src/client/java')
		}
		resources {
			srcDir new File(commonDir, 'src/client/resources')
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		outputDirectory = new File(commonDir, 'src/main/generated')
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
	runtimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}

processResources {
	inputs.property 'version', project.version

	filesMatching('fabric.mod.json') {
		expand 'version': inputs.properties.version
	}
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	archiveClassifier = 'fabric'
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${archives_base_name}" }
	}
}

tasks.withType(Jar).configureEach { task ->
	if (task.name == 'sourcesJar' || task.name.toLowerCase().contains('sources')) {
		task.archiveClassifier = 'fabric-sources'
	}
}

publishing {
	publications {
		create('mavenJava', MavenPublication) {
			artifactId = "${archives_base_name}-fabric"
			from components.java
		}
	}
	repositories {

	}
}

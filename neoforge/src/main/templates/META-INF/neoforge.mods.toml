modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Me!"
description = '''
Spellgems - spell gems, wands, and enchanting for Minecraft.
'''
iconFile = "assets/spellgems/icon.png"

# Experience redirect is shared. Death-drop capture stays Fabric-only so Neo does not rewrite drops twice.
# Client mixins (scroll cycle, astral bow draw) are shared with Fabric.
[[mixins]]
config = "spellgems.mixins.json"

[[mixins]]
config = "spellgems.client.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
